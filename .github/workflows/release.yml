# Push a tag with the plugin version (for example 0.4.1) to make a release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check that the tag and the manifest version are the same
        run: |
          V=$(node -p 'require("./manifest.json").version')
          [ "$GITHUB_REF_NAME" = "$V" ] || { echo "::error::Tag $GITHUB_REF_NAME is not the manifest version $V. Use the tag $V."; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Make the zip for manual install
        run: mkdir work-timer && cp main.js manifest.json styles.css work-timer/ && zip -r "work-timer-$GITHUB_REF_NAME.zip" work-timer
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css "work-timer-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
