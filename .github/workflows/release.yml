# Push a tag with the plugin version (for example 1.0.1) to make a release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check that the tag and the manifest version are the same
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./manifest.json").version')"
      - run: npm ci
      - run: npm run build
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
